<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<title>BiblioTrack · Gestão de Biblioteca Escolar</title>
<meta name="description" content="Sistema profissional de controle e gestão de biblioteca escolar com acervo, alunos, empréstimos, reservas, multas e sincronização em tempo real via Firebase Firestore." />
<meta property="og:title" content="BiblioTrack · Gestão de Biblioteca Escolar" />
<meta property="og:description" content="Sistema profissional de controle de biblioteca escolar com catálogo de livros, cadastro de estudantes e controle de devoluções." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#4f46e5" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* =========================================================
   DESIGN SYSTEM & DESIGN TOKENS (WCAG AA & ZERO-PILL)
   ========================================================= */
:root {
  --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-soft: rgba(79, 70, 229, 0.08);
  --accent-2: #7c3aed;
  
  --bg: #f8fafc;
  --bg-surface: #ffffff;
  --bg-subtle: #f1f5f9;
  --bg-elevated: #ffffff;
  
  --text-main: #0f172a;
  --text-muted: #64748b;
  --text-subtle: #94a3b8;
  
  --border: #e2e8f0;
  --border-focus: #4f46e5;
  
  --success: #16a34a;
  --success-bg: #f0fdf4;
  --success-text: #15803d;
  
  --warning: #d97706;
  --warning-bg: #fffbeb;
  --warning-text: #b45309;
  
  --danger: #dc2626;
  --danger-bg: #fef2f2;
  --danger-text: #b91c1c;
  
  --info: #0284c7;
  --info-bg: #f0f9ff;
  --info-text: #0369a1;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  
  --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
  --shadow-lg: 0 12px 24px -4px rgba(15, 23, 42, 0.1), 0 4px 6px -2px rgba(15, 23, 42, 0.04);
}

[data-theme="dark"] {
  --bg: #090d16;
  --bg-surface: #111827;
  --bg-subtle: #1f2937;
  --bg-elevated: #1e293b;
  
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-subtle: #64748b;
  
  --border: #243044;
  
  --success-bg: rgba(22, 163, 74, 0.15);
  --warning-bg: rgba(217, 119, 6, 0.15);
  --danger-bg: rgba(220, 38, 38, 0.15);
  --info-bg: rgba(2, 132, 199, 0.15);
  
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.4);
  --shadow-md: 0 6px 16px -2px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 20px 30px -8px rgba(0, 0, 0, 0.7);
}

/* Base reset & typography */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; scroll-behavior: smooth; }
body {
  font-family: var(--font-sans);
  background-color: var(--bg);
  color: var(--text-main);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  background-image: 
    radial-gradient(circle at 10% 10%, color-mix(in srgb, var(--accent) 7%, transparent) 0%, transparent 40%),
    radial-gradient(circle at 90% 90%, color-mix(in srgb, var(--accent-2) 6%, transparent) 0%, transparent 40%);
  background-attachment: fixed;
  transition: background-color 0.25s, color 0.25s;
}

input, select, textarea, button { font-family: inherit; font-size: 0.93rem; color: inherit; }
button { cursor: pointer; border: none; background: transparent; }
a { color: var(--accent); text-decoration: none; }
.tabular-nums { font-variant-numeric: tabular-nums; font-family: var(--font-mono); }

/* Focus styles for WCAG accessibility */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* =========================================================
   COMPONENTS: BUTTONS, INPUTS, CARDS
   ========================================================= */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45rem;
  padding: 0.58rem 1rem;
  border-radius: var(--radius-sm);
  font-weight: 600;
  font-size: 0.88rem;
  transition: all 0.15s ease-in-out;
  white-space: nowrap;
  user-select: none;
}
.btn.primary {
  background: var(--accent);
  color: #ffffff;
  box-shadow: 0 2px 8px -2px color-mix(in srgb, var(--accent) 60%, transparent);
}
.btn.primary:hover:not(:disabled) {
  background: var(--accent-hover);
  transform: translateY(-1px);
}
.btn.ghost {
  background: var(--bg-subtle);
  color: var(--text-main);
  border: 1px solid var(--border);
}
.btn.ghost:hover:not(:disabled) {
  background: var(--border);
}
.btn.danger {
  background: var(--danger-bg);
  color: var(--danger-text);
  border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
}
.btn.danger:hover:not(:disabled) {
  background: color-mix(in srgb, var(--danger) 25%, transparent);
}
.btn.success {
  background: var(--success-bg);
  color: var(--success-text);
  border: 1px solid color-mix(in srgb, var(--success) 30%, transparent);
}
.btn.success:hover:not(:disabled) {
  background: color-mix(in srgb, var(--success) 25%, transparent);
}
.btn.small { padding: 0.35rem 0.65rem; font-size: 0.78rem; }
.btn.icon { width: 2.3rem; height: 2.3rem; border-radius: var(--radius-sm); padding: 0; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn.block { width: 100%; }

/* Input fields */
.field { margin-bottom: 1rem; text-align: left; }
.field label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 0.35rem;
}
.input-text, select, textarea {
  width: 100%;
  padding: 0.62rem 0.8rem;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-main);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.input-text:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);
}

/* Card */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 1.3rem;
  box-shadow: var(--shadow-sm);
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
}
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.8rem;
  margin-bottom: 1rem;
}
.card-head h2 {
  font-size: 1.05rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 0.45rem;
}
.card-head .meta-text {
  font-size: 0.8rem;
  color: var(--text-muted);
}

/* Stat cards */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 1rem;
  margin-bottom: 1.3rem;
}
.stat-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 1.1rem;
  position: relative;
  box-shadow: var(--shadow-sm);
}
.stat-card .label {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 700;
  color: var(--text-muted);
}
.stat-card .value {
  font-size: 1.85rem;
  font-weight: 800;
  line-height: 1.1;
  margin-top: 0.35rem;
  letter-spacing: -0.02em;
}
.stat-card .desc {
  font-size: 0.76rem;
  color: var(--text-muted);
  margin-top: 0.35rem;
}
.stat-card .icon-watermark {
  position: absolute;
  top: 0.9rem;
  right: 0.9rem;
  font-size: 1.4rem;
  opacity: 0.75;
}

/* Status texts (Zero-Pill clean typography) */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.75rem;
  font-weight: 600;
}
.status-pill.ok { color: var(--success); }
.status-pill.danger { color: var(--danger); }
.status-pill.warn { color: var(--warning); }
.status-pill.info { color: var(--info); }
.status-pill.muted { color: var(--text-muted); }

/* Table */
.table-container {
  overflow-x: auto;
  margin: 0 -1.3rem;
  padding: 0 1.3rem;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
  min-width: 620px;
}
th {
  text-align: left;
  padding: 0.7rem 0.75rem;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  border-bottom: 2px solid var(--border);
  font-weight: 700;
}
td {
  padding: 0.75rem 0.75rem;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
tbody tr:hover { background-color: var(--bg-subtle); }
.actions-cell { display: flex; gap: 0.35rem; flex-wrap: wrap; }

/* Grid of Books */
.books-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
  gap: 1.1rem;
}
.book-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 0.95rem;
  display: flex;
  flex-direction: column;
  transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
  position: relative;
}
.book-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
  border-color: color-mix(in srgb, var(--accent) 35%, var(--border));
}
.book-cover {
  aspect-ratio: 3/4;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.8rem;
  margin-bottom: 0.75rem;
  position: relative;
  overflow: hidden;
  user-select: none;
}
.book-title {
  font-weight: 700;
  font-size: 0.93rem;
  line-height: 1.3;
  margin-bottom: 0.2rem;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.book-author {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-bottom: 0.5rem;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.book-footer {
  margin-top: auto;
  padding-top: 0.65rem;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  font-size: 0.78rem;
}

/* =========================================================
   LOGIN SCREEN
   ========================================================= */
#loginScreen {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 1.5rem;
}
.login-box {
  width: 100%;
  max-width: 420px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 2.3rem 2rem;
  box-shadow: var(--shadow-lg);
  text-align: center;
  animation: modalEnter 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.login-logo {
  font-size: 3.2rem;
  margin-bottom: 0.4rem;
  animation: floatEmoji 3s ease-in-out infinite;
}
@keyframes floatEmoji { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.login-title {
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.login-title span { color: var(--accent); }
.login-desc {
  color: var(--text-muted);
  font-size: 0.86rem;
  margin-bottom: 1.3rem;
}
.login-tabs {
  display: flex;
  background: var(--bg-subtle);
  border-radius: var(--radius-sm);
  padding: 3px;
  margin-bottom: 1.2rem;
}
.login-tabs button {
  flex: 1;
  padding: 0.55rem;
  border-radius: 6px;
  font-weight: 600;
  font-size: 0.85rem;
  color: var(--text-muted);
  transition: all 0.15s;
}
.login-tabs button.active {
  background: var(--bg-surface);
  color: var(--text-main);
  box-shadow: var(--shadow-sm);
}

/* =========================================================
   LAYOUT & NAVIGATION
   ========================================================= */
#app { display: none; min-height: 100vh; flex-direction: column; }
.topbar {
  background: color-mix(in srgb, var(--bg-surface) 90%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0.7rem 1.4rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  position: sticky;
  top: 0;
  z-index: 40;
}
.brand-zone {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-weight: 800;
  font-size: 1.1rem;
  letter-spacing: -0.02em;
}
.brand-zone span.colored { color: var(--accent); }
.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 0.65rem;
}
.firestore-indicator {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.74rem;
  font-weight: 600;
  color: #ea580c;
  background: color-mix(in srgb, #f97316 12%, var(--bg-subtle));
  padding: 0.25rem 0.65rem;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, #f97316 25%, transparent);
  cursor: pointer;
}
.firestore-indicator .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #ea580c;
}
.user-chip {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.25rem 0.7rem 0.25rem 0.35rem;
  background: var(--bg-subtle);
  border-radius: 999px;
  font-size: 0.8rem;
}
.layout-container {
  display: grid;
  grid-template-columns: 240px 1fr;
  flex: 1;
  max-width: 1440px;
  width: 100%;
  margin: 0 auto;
}
.sidebar {
  padding: 1.2rem 0.9rem;
  border-right: 1px solid var(--border);
  position: sticky;
  top: 54px;
  height: calc(100vh - 54px);
  overflow-y: auto;
}
.sidebar .nav-group-title {
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-subtle);
  font-weight: 700;
  padding: 0.5rem 0.65rem 0.35rem;
}
.sidebar button {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.55rem 0.75rem;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  font-weight: 600;
  font-size: 0.88rem;
  text-align: left;
  transition: all 0.15s;
  margin-bottom: 2px;
}
.sidebar button:hover {
  background: var(--bg-subtle);
  color: var(--text-main);
}
.sidebar button.active {
  background: var(--accent);
  color: #ffffff;
}
.sidebar button .counter {
  margin-left: auto;
  font-size: 0.7rem;
  background: rgba(0, 0, 0, 0.08);
  padding: 0.1rem 0.45rem;
  border-radius: 999px;
}
.sidebar button.active .counter {
  background: rgba(255, 255, 255, 0.25);
  color: #ffffff;
}
main {
  padding: 1.6rem;
  overflow-x: hidden;
}

/* =========================================================
   TOOLBAR & FILTER BAR
   ========================================================= */
.search-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.7rem;
  margin-bottom: 1.1rem;
}
.filter-tabs {
  display: flex;
  gap: 0.35rem;
  flex-wrap: wrap;
}
.filter-tab {
  padding: 0.38rem 0.75rem;
  border-radius: 999px;
  background: var(--bg-subtle);
  color: var(--text-muted);
  font-size: 0.78rem;
  font-weight: 600;
  transition: all 0.15s;
  border: 1px solid var(--border);
}
.filter-tab:hover {
  background: var(--border);
  color: var(--text-main);
}
.filter-tab.active {
  background: var(--accent);
  color: #ffffff;
  border-color: var(--accent);
}

/* =========================================================
   MODAL DIALOG (ACCESSIBLE + ESC TRAP)
   ========================================================= */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.65);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  z-index: 100;
}
.overlay.show { display: flex; animation: fadeIn 0.2s ease-out; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-window {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.6rem;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: modalEnter 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes modalEnter {
  from { opacity: 0; transform: scale(0.96) translateY(12px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.1rem;
}
.modal-header h2 {
  font-size: 1.15rem;
  font-weight: 700;
}
.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 0.6rem;
  margin-top: 1.4rem;
}

/* =========================================================
   TOAST NOTIFICATIONS
   ========================================================= */
#toast-container {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  z-index: 200;
  pointer-events: none;
}
.toast {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0.75rem 1rem;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-size: 0.86rem;
  font-weight: 500;
  pointer-events: auto;
  max-width: 360px;
  animation: toastIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
.toast.success { border-left: 4px solid var(--success); }
.toast.error { border-left: 4px solid var(--danger); }
.toast.warn { border-left: 4px solid var(--warning); }
.toast.info { border-left: 4px solid var(--info); }
@keyframes toastIn { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* Responsive adjustments */
@media (max-width: 900px) {
  .layout-container { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed;
    left: -260px;
    top: 54px;
    bottom: 0;
    width: 250px;
    background: var(--bg-surface);
    z-index: 50;
    transition: left 0.25s ease;
  }
  .sidebar.open { left: 0; }
  .sidebar-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 45;
    display: none;
  }
  .sidebar-backdrop.show { display: block; }
  .menu-toggle-btn { display: inline-flex !important; }
}
.menu-toggle-btn { display: none; }
</style>
</head>
<body>

<div id="toast-container" role="status" aria-live="polite"></div>

<!-- ==================== TELA DE LOGIN ==================== -->
<section id="loginScreen" aria-label="Acesso ao Sistema">
  <div class="login-box">
    <div class="login-logo" aria-hidden="true">📚</div>
    <h1 class="login-title">Biblio<span>Track</span></h1>
    <p class="login-desc" id="loginDesc">Gestão Escolar com Firebase Firestore</p>

    <div class="firestore-indicator" onclick="mostrarInfoFirestore()" style="margin: 0 auto 1.2rem; width: fit-content;">
      <span class="dot"></span>
      <span>🔥 Firestore em Tempo Real</span>
    </div>

    <div class="login-tabs" role="tablist">
      <button id="tabAdmin" class="active" type="button" role="tab" onclick="setLoginTab('admin')">👨‍💼 Bibliotecário</button>
      <button id="tabAluno" type="button" role="tab" onclick="setLoginTab('aluno')">🎓 Aluno</button>
    </div>

    <form id="loginForm">
      <div class="field" id="campoSenha">
        <label for="senhaInput">Senha do Bibliotecário</label>
        <input class="input-text" type="password" id="senhaInput" placeholder="Digite admin123" autocomplete="current-password" />
      </div>
      <div class="field" id="campoMatricula" style="display:none">
        <label for="matriculaInput">Matrícula do Estudante</label>
        <input class="input-text" type="text" id="matriculaInput" placeholder="Ex.: 2024001" autocomplete="username" />
      </div>
      <button class="btn primary block" type="submit" id="btnSubmitLogin" style="padding: 0.72rem;">
        Entrar no Sistema →
      </button>
    </form>

    <p style="font-size: 0.76rem; color: var(--text-subtle); margin-top: 1.2rem; line-height: 1.5;">

};

function handleFirestoreError(error, operationType, path) {
  const errInfo = {
    error: error instanceof Error ? error.message : String(error),
    operationType,
    path,
    authInfo: {
      userId: auth.currentUser?.uid || null,
      email: auth.currentUser?.email || null,
      isAnonymous: true
    }
  };
  console.error('Firestore Error:', JSON.stringify(errInfo));
  toast('Erro no Firestore: ' + (error?.message || error), 'error');
  throw new Error(JSON.stringify(errInfo));
}

// Parse de data local sem distorção de fuso horário UTC-3
function hojeISO() {
  const d = new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function somarDias(dataStr, dias) {
  const [y, m, d] = (dataStr || hojeISO()).split('-').map(Number);
  const data = new Date(y, m - 1, d);
  data.setDate(data.getDate() + dias);
  const ano = data.getFullYear();
  const mes = String(data.getMonth() + 1).padStart(2, '0');
  const dia = String(data.getDate()).padStart(2, '0');
  return `${ano}-${mes}-${dia}`;
}

function formatarData(dataStr) {
  if (!dataStr) return '—';
  const [y, m, d] = dataStr.split('-');
  return `${d}/${m}/${y}`;
}

function calcularAtrasoDias(dataPrevistaStr) {
  if (!dataPrevistaStr) return 0;
  const [y1, m1, d1] = hojeISO().split('-').map(Number);
  const [y2, m2, d2] = dataPrevistaStr.split('-').map(Number);
  const t1 = new Date(y1, m1 - 1, d1).getTime();
  const t2 = new Date(y2, m2 - 1, d2).getTime();
  return Math.max(0, Math.floor((t1 - t2) / (1000 * 60 * 60 * 24)));
}

// Sanitização estrita contra XSS
function escapeHTML(str) {

    '"': '&quot;',
    "'": '&#39;'
  }[c]));
}

function iniciarSincronizacao() {
  // Livros
  onSnapshot(collection(db, 'livros'), snap => {
    state.livros = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (state.livros.length === 0) seedInicialFirestore();
    render();
  }, err => handleFirestoreError(err, OperationType.GET, 'livros'));

  // Alunos
  onSnapshot(collection(db, 'alunos'), snap => {
    state.alunos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, err => handleFirestoreError(err, OperationType.GET, 'alunos'));

  // Empréstimos
  onSnapshot(collection(db, 'emprestimos'), snap => {
    state.emprestimos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, err => handleFirestoreError(err, OperationType.GET, 'emprestimos'));

  // Reservas
  onSnapshot(collection(db, 'reservas'), snap => {
    state.reservas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, err => handleFirestoreError(err, OperationType.GET, 'reservas'));

  // Configurações
  onSnapshot(doc(db, 'config', 'geral'), snap => {
    if (snap.exists()) {
      state.config = { ...DEFAULT_CONFIG, ...snap.data() };
      aplicarTema();
      aplicarMarca();
      render();

}

function toast(msg, type = 'info') {
  const icons = { success: '✅', error: '❌', warn: '⚠️', info: 'ℹ️' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${icons[type] || 'ℹ️'}</span><span>${escapeHTML(msg)}</span>`;
  $('#toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3400);
}

function openModal(titulo, bodyHtml, onSubmit, opts = {}) {
  let overlay = document.getElementById('modalOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'modalOverlay';
    overlay.className = 'overlay';
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.innerHTML = `
      <div class="modal-window">
        <div class="modal-header">
          <h2 id="modalTitle"></h2>
          <button class="btn icon ghost" onclick="closeModal()" aria-label="Fechar modal">✕</button>
        </div>
        <form id="modalForm">
          <div id="modalBody"></div>
          <div class="modal-footer" id="modalFooter"></div>
        </form>
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  }
  $('#modalTitle').textContent = titulo;
  $('#modalBody').innerHTML = bodyHtml;
  overlay.classList.add('show');
  
  const form = $('#modalForm');
  form.onsubmit = async e => {
    e.preventDefault();
    const submitBtn = $('#modalSubmitBtn');
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.textContent = 'Salvando...';
    }
    try {
      await onSubmit(new FormData(form));
    } finally {
      if (submitBtn) submitBtn.disabled = false;
    }
  };

  const footer = $('#modalFooter');
  const submitCls = opts.danger ? 'danger' : 'primary';
  footer.innerHTML = `
    <button type="button" class="btn ghost" onclick="closeModal()">${opts.cancelLabel || 'Cancelar'}</button>
    <button type="submit" class="btn ${submitCls}" id="modalSubmitBtn">${opts.submitLabel || 'Confirmar'}</button>`;
  
  setTimeout(() => form.querySelector('input, select, textarea')?.focus(), 60);
}

function closeModal() {
  $('#modalOverlay')?.classList.remove('show');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

function confirmar(titulo, mensagem, isDanger = true) {
  return new Promise(resolve => {
    openModal(titulo, `<p style="color:var(--text-muted); line-height:1.6;">${escapeHTML(mensagem)}</p>`, () => {
      closeModal();
      resolve(true);
    }, {
      submitLabel: 'Sim, confirmar',
      cancelLabel: 'Cancelar',
      danger: isDanger
    });
  });
}

/* =========================================================
   MÓDULO: LIVROS (CRUD COM CONTROLE DE ESTOQUE)
   ========================================================= */
function renderLivros() {
  const q = (state.filtroTexto || '').toLowerCase();
  let lista = state.livros.filter(l =>
    (l.titulo || '').toLowerCase().includes(q) ||
    (l.autor || '').toLowerCase().includes(q) ||
    (l.categoria || '').toLowerCase().includes(q) ||
    (l.isbn || '').toLowerCase().includes(q)
  );

  if (state.filtroCategoria === 'disponiveis') lista = lista.filter(l => disponiveis(l.id) > 0);
  if (state.filtroCategoria === 'esgotados') lista = lista.filter(l => disponiveis(l.id) === 0);

  $('#main').innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; margin-bottom:1.2rem;">
      <div>
        <h1 style="font-size:1.55rem; font-weight:800; letter-spacing:-0.02em;">Acervo de Livros</h1>
        <p style="color:var(--text-muted); font-size:0.86rem;">${state.livros.length} títulos cadastrados</p>
      </div>
      <button class="btn primary" onclick="modalLivro()">+ Adicionar Livro</button>
    </div>

    <div class="search-toolbar">
      <input class="input-text" style="max-width:320px;" placeholder="🔍 Buscar por título, autor, gênero ou ISBN" 
        value="${escapeHTML(state.filtroTexto)}" oninput="state.filtroTexto = this.value; renderLivros();" />
      
      <div class="filter-tabs">
        <button class="filter-tab ${state.filtroCategoria === 'todos' ? 'active' : ''}" onclick="state.filtroCategoria='todos'; renderLivros();">Todos</button>
        <button class="filter-tab ${state.filtroCategoria === 'disponiveis' ? 'active' : ''}" onclick="state.filtroCategoria='disponiveis'; renderLivros();">✅ Disponíveis</button>
        <button class="filter-tab ${state.filtroCategoria === 'esgotados' ? 'active' : ''}" onclick="state.filtroCategoria='esgotados'; renderLivros();">❌ Esgotados</button>
      </div>
    </div>

    ${lista.length ? `
      <div class="books-grid">
        ${lista.map(l => {
          const d = disponiveis(l.id);
          return `
            <div class="book-card">
              <div class="book-cover" style="background:var(--bg-subtle);">${l.capa || '📕'}</div>
              <div class="book-title">${escapeHTML(l.titulo)}</div>
              <div class="book-author">${escapeHTML(l.autor)} · ${escapeHTML(l.categoria || 'Geral')}</div>
              <div class="book-footer">
                <span class="status-pill ${d > 0 ? 'ok' : 'danger'}">${d > 0 ? `${d}/${l.quantidade} disp.` : 'Esgotado'}</span>
                <div class="actions-cell">
                  <button class="btn ghost small" onclick="verQrCodeLivro('${l.id}')" title="Gerar QR Code">📱 QR</button>
                  <button class="btn ghost small" onclick="modalLivro('${l.id}')" title="Editar livro">✏️</button>
                  <button class="btn danger small" onclick="deletarLivro('${l.id}')" title="Remover livro">🗑️</button>
                </div>
              </div>
            </div>`;
        }).join('')}
      </div>
    ` : `
      <div class="card" style="text-align:center; padding:3rem 1rem; color:var(--text-muted);">
        <p style="font-size:2rem; margin-bottom:0.5rem;">📚</p>
        <p>Nenhum livro corresponde à busca.</p>
      </div>
    `}
  `;
}

function modalLivro(id) {

    <div class="field">
      <label>Título da Obra *</label>

    </div>

      <div class="field">
        <label>Gênero / Categoria</label>
        <input class="input-text" name="categoria" placeholder="Ex: Romance, Ficção" value="${escapeHTML(l.categoria || '')}" />
      </div>
      <div class="field">
        <label>Ano de Publicação</label>
        <input class="input-text" name="ano" type="number" min="1500" max="2100" value="${l.ano || 2024}" />

    </div>

        <input class="input-text" name="isbn" placeholder="978-..." value="${escapeHTML(l.isbn || '')}" />
      </div>
      <div class="field">
        <label>Quantidade de Exemplares *</label>

    </div>

    const docId = id || uid();
    const payload = {
      id: docId,
      titulo: fd.get('titulo').trim(),
      autor: fd.get('autor').trim(),
      categoria: fd.get('categoria').trim(),
      ano: Number(fd.get('ano')) || null,
      isbn: fd.get('isbn').trim(),
      quantidade: Math.max(1, Number(fd.get('quantidade')) || 1),
      capa: fd.get('capa').trim() || '📕',
      sinopse: fd.get('sinopse').trim()
    };
    await setDoc(doc(db, 'livros', docId), payload);

}

async function deletarLivro(id) {
  if (ativosDoLivro(id) > 0) {
    return toast('Não é permitido excluir um livro com exemplares emprestados.', 'error');
  }
  if (!await confirmar('Excluir Livro', 'Deseja realmente remover este livro do acervo? O histórico será preservado.')) return;
  await deleteDoc(doc(db, 'livros', id));
  toast('Livro excluído com sucesso.', 'success');
}

function verQrCodeLivro(id) {
  const l = getLivro(id);
  if (!l) return;
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(`BIBLIOTRACK-LIVRO:${l.id}:${l.titulo}`)}`;
  openModal(`📱 QR Code · ${l.titulo}`, `
    <div style="text-align:center; padding:1rem 0;">
      <img src="${qrUrl}" alt="QR Code do livro" style="width:200px; height:200px; border-radius:8px; border:1px solid var(--border);" />
      <p style="margin-top:1rem; font-size:0.85rem; color:var(--text-muted);">
        Código identificador único: <code>${l.id}</code><br>
        ISBN: <code>${l.isbn || 'Sem ISBN'}</code>
      </p>
    </div>
  `, () => closeModal(), { submitLabel: 'Fechar', cancelLabel: 'OK' });
}

function modalAluno(id) {

    <div class="field">
      <label>Nome Completo *</label>
      <input class="input-text" name="nome" required minlength="3" maxlength="150" value="${escapeHTML(a.nome)}" />
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.7rem;">
      <div class="field">
        <label>Matrícula Única *</label>

async function deletarAluno(id) {
  if (ativosDoAluno(id) > 0) {
    return toast('Não é possível excluir aluno com livros pendentes de devolução.', 'error');
  }
  if (!await confirmar('Excluir Aluno', 'Tem certeza que deseja apagar o registro deste aluno?')) return;
  await deleteDoc(doc(db, 'alunos', id));
  toast('Aluno excluído com sucesso.', 'success');
}

  $('#main').innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; margin-bottom:1.2rem;">
      <div>
        <h1 style="font-size:1.55rem; font-weight:800; letter-spacing:-0.02em;">Controle de Empréstimos</h1>
        <p style="color:var(--text-muted); font-size:0.86rem;">Gestão de prazos, multas e devoluções</p>
      </div>

      <div class="table-container">
        <table>

                <td>${escapeHTML(a?.nome || '(Excluído)')}</td>

                <td>${formatarData(e.dataPrevista)}</td>
                <td>
                  <span class="status-pill ${st.cls}">${st.txt}</span>
                  ${st.atraso > 0 ? `<br><small style="color:var(--danger); font-weight:700;">Multa: R$ ${st.multa}</small>` : ''}
                </td>
                <td>
                  <div class="actions-cell">
                    ${!e.dataDevolucao ? `
                      <button class="btn success small" onclick="devolverLivro('${e.id}')">✓ Devolver</button>
                      <button class="btn ghost small" onclick="renovarPrazoEmprestimo('${e.id}')">🔄 Renovar</button>
                    ` : `<span style="font-size:0.75rem; color:var(--text-muted);">Devolvido ${formatarData(e.dataDevolucao)}</span>`}
                    <button class="btn danger small" onclick="deletarEmprestimo('${e.id}')">🗑️</button>
                  </div>
                </td>
              </tr>`;
            }).join('') || `<tr><td colspan="6" style="text-align:center; padding:2rem; color:var(--text-muted);">Nenhum empréstimo ativo.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function modalNovoEmprestimo() {
  const livrosDisponiveis = state.livros.filter(l => disponiveis(l.id) > 0);
  if (!livrosDisponiveis.length) return toast('Não há livros com exemplares disponíveis no momento.', 'error');
  if (!state.alunos.length) return toast('Cadastre alunos no sistema primeiro.', 'error');

  const hoje = hojeISO();
  const prazo = somarDias(hoje, state.config.prazoPadrao || 14);

  openModal('Registrar Empréstimo', `
    <div class="field">
      <label>Selecione o Livro *</label>
      <select name="livroId" required>
        ${livrosDisponiveis.map(l => `<option value="${l.id}">${escapeHTML(l.titulo)} (${disponiveis(l.id)} disponíveis)</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Selecione o Aluno *</label>
      <select name="alunoId" required>
        ${state.alunos.map(a => `<option value="${a.id}">${escapeHTML(a.nome)} (${ativosDoAluno(a.id)}/${state.config.maxEmprestimos} ativos)</option>`).join('')}
      </select>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.7rem;">
      <div class="field">
        <label>Data de Retirada</label>
        <input class="input-text" type="date" name="dataEmprestimo" value="${hoje}" required />
      </div>
      <div class="field">
        <label>Data Prevista de Retorno</label>
        <input class="input-text" type="date" name="dataPrevista" value="${prazo}" required />
      </div>
    </div>
  `, async fd => {
    const alunoId = fd.get('alunoId');
    if (ativosDoAluno(alunoId) >= state.config.maxEmprestimos) {
      return toast(`Aluno atingiu o limite de ${state.config.maxEmprestimos} empréstimos simultâneos.`, 'error');
    }
    const docId = uid();
    const payload = {
      id: docId,
      livroId: fd.get('livroId'),
      alunoId,
      dataEmprestimo: fd.get('dataEmprestimo'),
      dataPrevista: fd.get('dataPrevista'),
      dataDevolucao: null,
      renovacoes: 0
    };
    await setDoc(doc(db, 'emprestimos', docId), payload);
    closeModal();
    toast('Empréstimo registrado com sucesso!', 'success');
  });
}

async function devolverLivro(id) {
  if (!await confirmar('Devolução de Livro', 'Deseja confirmar a devolução do livro e retorno ao acervo?')) return;
  await updateDoc(doc(db, 'emprestimos', id), { dataDevolucao: hojeISO() });
  toast('Livro devolvido com sucesso!', 'success');
}

async function renovarPrazoEmprestimo(id) {
  const e = state.emprestimos.find(x => x.id === id);
  if (!e) return;
  if ((e.renovacoes || 0) >= 1) return toast('Este empréstimo já atingiu o limite de renovação.', 'warn');
  if (calcularAtrasoDias(e.dataPrevista) > 0) return toast('Empréstimos atrasados não podem ser renovados. Quite a devolução.', 'error');

  const novoPrazo = somarDias(e.dataPrevista, state.config.prazoPadrao || 14);
  if (!await confirmar('Renovar Prazo', `O novo prazo será ${formatarData(novoPrazo)}. Confirmar?`)) return;

  await updateDoc(doc(db, 'emprestimos', id), {
    dataPrevista: novoPrazo,
    renovacoes: (e.renovacoes || 0) + 1
  });
  toast('Empréstimo renovado com sucesso!', 'success');
}

async function deletarEmprestimo(id) {
  if (!await confirmar('Apagar Empréstimo', 'Deseja excluir este registro permanentemente do banco?')) return;
  await deleteDoc(doc(db, 'emprestimos', id));
  toast('Empréstimo excluído.', 'success');
}

   MÓDULO: RESERVAS
   ========================================================= */
function renderReservas() {
  $('#main').innerHTML = `

      <h1 style="font-size:1.55rem; font-weight:800; letter-spacing:-0.02em;">Fila de Reservas</h1>
      <p style="color:var(--text-muted); font-size:0.86rem;">Pedidos de reserva efetuados pelos alunos</p>

    <div class="card">
      <div class="table-container">
        <table>
          <thead><tr><th>Livro</th><th>Aluno</th><th>Data Solicitação</th><th>Status</th><th>Ações</th></tr></thead>
          <tbody>
            ${state.reservas.map(r => {
              const l = getLivro(r.livroId);
              const a = getAluno(r.alunoId);
              return `<tr>
                <td><strong>${escapeHTML(l?.titulo || '—')}</strong></td>
                <td>${escapeHTML(a?.nome || '—')}</td>
                <td>${formatarData(r.dataReserva || r.data)}</td>
                <td><span class="status-pill ${r.status === 'aprovada' ? 'ok' : r.status === 'pendente' ? 'warn' : 'muted'}">${r.status}</span></td>
                <td>
                  ${r.status === 'pendente' ? `
                    <button class="btn success small" onclick="aprovarReserva('${r.id}')">✓ Aprovar</button>
                    <button class="btn danger small" onclick="rejeitarReserva('${r.id}')">✕ Rejeitar</button>
                  ` : '—'}
                </td>
              </tr>`;
            }).join('') || `<tr><td colspan="5" style="text-align:center; padding:2rem; color:var(--text-muted);">Nenhuma reserva registrada.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

async function aprovarReserva(id) {
  const r = state.reservas.find(x => x.id === id);
  if (!r) return;
  if (disponiveis(r.livroId) === 0) return toast('Sem exemplares disponíveis deste livro no momento.', 'error');
  if (ativosDoAluno(r.alunoId) >= state.config.maxEmprestimos) return toast('Aluno atingiu o limite máximo de livros.', 'error');

  const empId = uid();
  const novoEmp = {
    id: empId,
    livroId: r.livroId,
    alunoId: r.alunoId,
    dataEmprestimo: hojeISO(),
    dataPrevista: somarDias(hojeISO(), state.config.prazoPadrao || 14),
    dataDevolucao: null,
    renovacoes: 0
  };
  await setDoc(doc(db, 'emprestimos', empId), novoEmp);
  await updateDoc(doc(db, 'reservas', id), { status: 'aprovada' });
  toast('Reserva aprovada e empréstimo gerado!', 'success');
}

async function rejeitarReserva(id) {
  await updateDoc(doc(db, 'reservas', id), { status: 'rejeitada' });
  toast('Reserva rejeitada.', 'info');
}

/* =========================================================
   MÓDULO: RELATÓRIOS & EXPORTAÇÃO CSV

function baixarCSV(conteudo, nomeArquivo) {
  const blob = new Blob(['\uFEFF' + conteudo], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = nomeArquivo;
  link.click();
  toast('Download de CSV concluído!', 'success');
}

function exportarCSVLivros() {
  const header = 'ID,Titulo,Autor,Categoria,Ano,ISBN,Exemplares,Disponiveis\n';
  const linhas = state.livros.map(l => 
    `"${l.id}","${l.titulo}","${l.autor}","${l.categoria || ''}","${l.ano || ''}","${l.isbn || ''}","${l.quantidade || 0}","${disponiveis(l.id)}"`
  ).join('\n');
  baixarCSV(header + linhas, `bibliotrack-livros-${hojeISO()}.csv`);
}

function exportarCSVAlunos() {
  const header = 'ID,Nome,Matricula,Turma,Email,EmprestimosAtivos\n';
  const linhas = state.alunos.map(a => 
    `"${a.id}","${a.nome}","${a.matricula}","${a.turma || ''}","${a.email || ''}","${ativosDoAluno(a.id)}"`
  ).join('\n');
  baixarCSV(header + linhas, `bibliotrack-alunos-${hojeISO()}.csv`);
}

function exportarCSVEmprestimos() {
  const header = 'ID,Livro,Aluno,DataEmprestimo,DataPrevista,DataDevolucao,Status,AtrasoDias,MultaEstimada\n';
  const linhas = state.emprestimos.map(e => {
    const l = getLivro(e.livroId);
    const a = getAluno(e.alunoId);
    const st = statusEmprestimo(e);
    return `"${e.id}","${l?.titulo || ''}","${a?.nome || ''}","${e.dataEmprestimo}","${e.dataPrevista}","${e.dataDevolucao || ''}","${st.txt}","${st.atraso}","${st.multa}"`;
  }).join('\n');
  baixarCSV(header + linhas, `bibliotrack-emprestimos-${hojeISO()}.csv`);
}

async function solicitarReserva(livroId) {
  const alunoId = state.sessao.alunoId;
  if (ativosDoAluno(alunoId) >= state.config.maxEmprestimos) {
    return toast(`Você já atingiu o limite de ${state.config.maxEmprestimos} empréstimos.`, 'error');
  }
  const jaReservou = state.reservas.some(r => r.alunoId === alunoId && r.livroId === livroId && r.status === 'pendente');
  if (jaReservou) return toast('Você já tem uma reserva pendente deste livro.', 'warn');

  const docId = uid();
  await setDoc(doc(db, 'reservas', docId), {
    id: docId,
    livroId,
    alunoId,
    dataReserva: hojeISO(),
    status: 'pendente'
  });
  toast('Reserva solicitada! Aguarde a aprovação do bibliotecário.', 'success');
}
